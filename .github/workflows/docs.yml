# Compuerta de docs (expediente 0003, tramo T-2; decisión D-09, endurecimiento K-11).
#
# Workflow PROPIO y aparte de `ci.yml` (que es compartido y no se toca): verifica la documentación y termina.
#   - SIN `paths`: corre en todo cambio, como las puertas de `ci.yml:1` («EN TODO CAMBIO»). Un check requerido con
#     filtro de rutas queda «esperando» en los PR que no tocan esas rutas y frena la fusión.
#   - NO compila la Api ni nada: sólo bash y el python3 del runner (decisión K-06 para la ola 1).
#   - NO publica ni despliega: no hay paso de publicación, ni secretos, ni permiso de escritura.
#   - Evento `pull_request` y nunca su variante «_target» (K-11): el código de un PR corre sin acceso al repositorio.
#   - Acciones fijadas a una versión exacta.
#
# Corre `scripts/docs-local.sh`, el mismo guion que se usa en local: copia con huella `.docs-guard/` (verificada contra
# `.docs-guard/source.lock`), autoprueba del par rojo/verde y los controles por ámbito. En la ola 1 todo arranca en
# AVISA (decisión D-10): un hallazgo es una advertencia del PR y el job queda verde. Rojo sólo si la copia no coincide
# con su huella, si la autoprueba falla (la compuerta está rota) o si un control da error de uso.
# Para pasar `docs-as-code/**` a bloquea basta con cambiar DOCS_MODO_DOCS_AS_CODE (ver docs-as-code/controles/README.md).

name: docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOCS_MODO_DOCS_AS_CODE: avisa
      DOCS_PORTAL: 'no'   # el portal lo construye el job `portal`, que es el único con red
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Compuerta de docs (huella, autoprueba y controles por ámbito)
        run: bash scripts/docs-local.sh

  # Portal de documentación (expediente 0003, folio 018 §2 y §8, PR-P4). Construye el sitio con MkDocs Material en la
  # imagen de Python fijada por digest (`scripts/docs-portal.sh`, dependencias con `--require-hashes`), lo construye
  # dos veces para exigir que sea reproducible, corre `portal_negativo.py` sobre él y lo sube como ARTEFACTO.
  #   - NO publica ni despliega: no hay secretos, ni permiso de escritura, ni dominio (la exposición la decide el PO).
  #   - Mismo endurecimiento que la compuerta: `contents: read`, sin `paths`, acciones con versión fija.
  #   - En AVISA (folio 018 §7): un hallazgo de portal-negativo es una advertencia y el job queda verde. Rojo si el
  #     build `--strict` falla o si dos corridas del mismo commit dan sitios distintos.
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build del portal en contenedor fijo, dos veces, y portal-negativo (avisa)
        env:
          PORTAL_SALIDA: ${{ runner.temp }}/portal
          PORTAL_REPRODUCIBLE: si
        run: |
          rc=0
          salida="$(bash scripts/docs-portal.sh 2>&1)" || rc=$?
          printf '%s\n' "$salida" | sed 's/^::error /::warning /'
          if [ "$rc" != 0 ] && ! printf '%s\n' "$salida" | grep -q '^== portal-negativo: ROJO'; then exit "$rc"; fi

      - name: Subir el sitio como artefacto (no se despliega)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: portal-sitio
          path: ${{ runner.temp }}/portal/site
          if-no-files-found: error
          retention-days: 7

  # Controles OpenAPI (expediente 0003, tramo T-6): oasdiff `breaking` (Tufin) y Spectral (tres reglas propias) sobre
  # la instantánea `docs-as-code/api/openapi-v1.json`. Job aparte de la compuerta porque necesita Docker y baja dos
  # imágenes con versión fija (en `docs-as-code/controles/openapi.sh`); la compuerta principal sigue sin red. El
  # recuento contra el contrato corre en la compuerta (`recuento_openapi.py`, sin red).
  #   - Mismo endurecimiento que la compuerta: `contents: read`, sin secretos, sin `paths`, acciones con versión fija.
  #   - En AVISA: un hallazgo es una advertencia del PR y el job queda verde. Rojo sólo si la autoprueba del par
  #     rojo/verde falla (los controles están rotos) o si hay un error de uso.
  #   - oasdiff compara la instantánea de la base (en un PR, la rama base; en push, el commit anterior) con la del árbol.
  #   - No compila la Api ni levanta nada: la instantánea la regenera el job `instantanea-openapi`.
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: oasdiff y Spectral sobre la instantánea (avisa)
        env:
          BASE_PR: ${{ github.base_ref }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          base=""
          if [ -n "$BASE_PR" ]; then base="origin/$BASE_PR"
          elif [ -n "$BASE_PUSH" ] && git cat-file -e "$BASE_PUSH^{commit}" 2>/dev/null; then base="$BASE_PUSH"; fi
          bash docs-as-code/controles/openapi.sh ${base:+"$base"}

  # Instantánea OpenAPI (expediente 0003, tramo T-5; decisiones K-07 y K-12). Job APARTE de la compuerta:
  #   - Sólo en push a main (`if`): nunca en un PR, así que la tarea no recae sobre ningún PR de producto.
  #   - Es el único job con permiso de escritura (`contents`, `pull-requests` e `issues`); la compuerta sigue en lectura.
  #   - Checkout SIN credenciales persistidas (B6 de la revisión externa): la compilación y la Api corren sin token en
  #     `.git/config`; el token entra sólo en el último paso, para empujar la rama y abrir el PR.
  #   - Extracción aislada (`docs-as-code/api/extraer-openapi.sh`): proceso local en el runner, almacén efímero en un
  #     directorio temporal, clave de firma descartable y puerto propio. Sin Docker, sin secretos, sin despliegue.
  #   - Si el documento cambió, empuja la rama fija `automatico/instantanea-openapi` y abre (o actualiza) un PR. Ese PR
  #     lo revisa una persona o agente, que agrega la entrada en `docs-as-code/api/CHANGELOG-API.md`.
  #   - Si no puede abrir el PR (p. ej. el repositorio no permite que Actions cree PRs), NO queda verde con un aviso
  #     adentro (A1 de la revisión externa): abre o comenta el issue de etiqueta fija `instantanea-openapi` y el job
  #     falla. La rama queda empujada para abrir el PR a mano.
  instantanea-openapi:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: instantanea-openapi
      cancel-in-progress: false
    env:
      RAMA: automatico/instantanea-openapi
      ETIQUETA: instantanea-openapi
      GF_OPENAPI_PUERTO: '5199'
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '10.0.403'

      - name: Extraer el documento (aislado)
        run: bash docs-as-code/api/extraer-openapi.sh

      - name: Abrir o actualizar el PR automático si cambió
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs-as-code/api/openapi-v1.json; then
            echo "La instantánea no cambió."; exit 0
          fi
          git diff --stat -- docs-as-code/api/openapi-v1.json
          git switch -C "$RAMA"
          git add docs-as-code/api/openapi-v1.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "EXP-0003: instantánea OpenAPI regenerada desde ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RAMA"
          if [ -n "$(gh pr list --head "$RAMA" --state open --json number --jq '.[].number')" ]; then
            echo "PR abierto actualizado."; exit 0
          fi
          if gh pr create --base main --head "$RAMA" \
            --title "EXP-0003: instantánea OpenAPI regenerada" \
            --body "Regenerada por el job \`instantanea-openapi\` de \`docs.yml\` desde ${GITHUB_SHA}. Antes de fusionar: agregar la entrada en \`docs-as-code/api/CHANGELOG-API.md\`."; then
            exit 0
          fi
          # Sin PR: aviso durable en un issue de etiqueta fija (se busca por etiqueta, no por título) y el job falla.
          corrida="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          aviso="No se pudo abrir el PR automático de la instantánea OpenAPI (corrida ${corrida}, commit ${GITHUB_SHA::7}). La rama \`${RAMA}\` quedó empujada: abrir el PR a mano y agregar la entrada en \`docs-as-code/api/CHANGELOG-API.md\`."
          gh label create "$ETIQUETA" --color D93F0B --description "Aviso del job instantanea-openapi de docs.yml" 2>/dev/null || true
          issue="$(gh issue list --label "$ETIQUETA" --state open --json number --jq '.[0].number')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$aviso" || echo "::error::Tampoco se pudo comentar el issue #$issue."
          else
            gh issue create --title "Instantánea OpenAPI sin PR" --label "$ETIQUETA" --body "$aviso" \
              || echo "::error::Tampoco se pudo abrir el issue de aviso."
          fi
          echo "::error::No se pudo abrir el PR automático de la instantánea; la rama $RAMA quedó empujada."
          exit 1
