# Carril programado de docs (expediente 0003, tramo T-7; decisión D-17, control «Enlaces externos» de la §5.2).
# Revisión externa R-G2 (folio 017): el control vive en `docs-as-code/controles/enlaces_externos.py` con su par
# rojo/verde en `autoprueba.sh`; las excepciones vencen (`enlaces-excepciones.txt`); el issue se busca por etiqueta y
# se cierra solo cuando no quedan caídos.
#
# Workflow PROPIO y aparte de `docs.yml` y de `ci.yml`: revisa los enlaces externos (http/https) de la documentación
# una vez por semana y, si hay enlaces caídos, abre (o actualiza) un issue; si ya no hay, lo cierra. SÓLO AVISA:
#   - No corre en PRs ni en push: un sitio ajeno caído no debe frenar ninguna fusión ni la conformación automática.
#   - El job queda verde aunque haya enlaces caídos; el aviso es el issue. Rojo sólo si el guion falla por uso.
#   - NO compila, NO publica y NO despliega: sin secretos; el único permiso de escritura es `issues: write`.
#   - Sin acciones de terceros salvo `actions/checkout`, fijada a una versión exacta; el control es python3 del
#     runner, sin dependencias.
# Ámbito: los `.md` de `docs-as-code/**`, `README.md` y `SDD/Docs/**` (este último sólo se informa: se eleva, no se
# corrige). Se ignoran los nombres sin dominio (internos de contenedor), `localhost`, `127.0.0.1`, `example.com/.org`
# y los ejemplos con marcadores (`{`, `<`).

name: docs-programado

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-programado
  cancel-in-progress: false

jobs:
  enlaces-externos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      ETIQUETA_ISSUE: docs-enlaces
      TITULO_ISSUE: 'EXP-0003: enlaces externos caídos en la documentación'
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Revisar enlaces externos (avisa)
        id: revisar
        run: >-
          python3 -I docs-as-code/controles/enlaces_externos.py
          --excepciones docs-as-code/controles/enlaces-excepciones.txt
          --informe informe-enlaces.md

      # El issue se identifica por la etiqueta fija `docs-enlaces`, no por el título (hallazgo B1): renombrarlo no
      # duplica. Con caídos se abre o se comenta; sin caídos, si hay uno abierto, se comenta y se cierra (B2).
      - name: Abrir, actualizar o cerrar el issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CAIDOS: ${{ steps.revisar.outputs.caidos }}
        run: |
          cat informe-enlaces.md >> "$GITHUB_STEP_SUMMARY"
          n=$(gh issue list --state open --label "$ETIQUETA_ISSUE" --json number --jq 'sort_by(.number) | .[0].number // empty')
          if [ "$CAIDOS" != '0' ]; then
            if [ -n "$n" ]; then
              gh issue comment "$n" --body-file informe-enlaces.md
            else
              gh label create "$ETIQUETA_ISSUE" --color d93f0b \
                --description 'Aviso semanal de enlaces externos caídos (docs-programado.yml)' 2>/dev/null || true
              gh issue create --title "$TITULO_ISSUE" --label "$ETIQUETA_ISSUE" --body-file informe-enlaces.md
            fi
          elif [ -n "$n" ]; then
            gh issue comment "$n" --body-file informe-enlaces.md
            gh issue close "$n" --reason completed
          fi
