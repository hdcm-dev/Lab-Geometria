# Integración continua: LAS DOS PUERTAS BLOQUEANTES, EN TODO CAMBIO.
#
# EL HUECO QUE ESTE FLUJO TAPA, y está medido, no supuesto. Hasta hoy el repositorio tenía
# UN SOLO flujo —`deploy-front-ftp`— y ese flujo se dispara por filtro de rutas:
#
#     src/GeometriaFactory.Web/**   visor/**   src/GeometriaFactory.Contracts/**
#
# De modo que un cambio en `GeometriaFactory.Api`, en `GeometriaFactory.Infrastructure`, en
# `GeometriaFactory.Domain`, en `scripts/` o en las tres baterías de prueba **no disparaba
# absolutamente nada**. `QG-01` y `QG-02` —que `Api/09 Pipeline-CI-CD.md` §2.1 declara
# BLOQUEANTES— sólo corrían cuando el cambio tocaba el front por casualidad.
#
# Y NO ES TEÓRICO. Buena parte de las unidades entregadas esta semana —el guion de respaldo,
# la salud del almacén, el modo WAL, la agrupación de conexiones— viven íntegramente fuera de
# ese filtro. Se fusionaron sin que ninguna puerta se ejecutara en la máquina de integración.
# Las dos que resultaron rotas —`U-01` y `U-03`— están en esa lista.
#
# EL PROPIO ARCHIVO DEL FLUJO TAMPOCO ESTABA EN EL FILTRO, y eso se acaba de pagar: el cambio
# que agregó los reintentos de FTP se fusionó y NO DISPARÓ NADA. Hubo que lanzarlo a mano.
# Acá `.github/workflows/**` está incluido a propósito: un flujo que no se prueba a sí mismo
# es un flujo que se descubre roto el día que se lo necesita.
#
# ============================ POR QUÉ SEPARADO Y NO AMPLIANDO EL FILTRO =====================
#
# Porque son dos cosas distintas y ahora estaban pegadas:
#
#   VERIFICAR   es barato, no tiene efectos, y debe correr SIEMPRE y en TODA rama.
#   PUBLICAR    toca un servidor real, depende de secretos y de un anfitrión que a veces
#               tiene los archivos tomados; NO debe correr en cada empujón.
#
# Con un solo flujo, ampliar el filtro para cubrir el `Api` habría significado publicar el
# front cada vez que alguien toca el dominio. La separación deja que cada uno corra por su
# propia razón.
#
# ESTE FLUJO NO PUBLICA NADA y no lee ningún secreto. Corre las dos puertas y termina.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  puertas:
    runs-on: ubuntu-latest
    steps:
      # CON TODO EL HISTORIAL Y LAS ETIQUETAS, y no es un lujo. `Directory.Build.props` adopta
      # MinVer, que calcula la versión desde la última etiqueta `v*` alcanzable. El checkout por
      # omisión trae UN commit y ninguna etiqueta, y sobre eso MinVer calcula `0.0.0-alpha.0` sin
      # advertir: las puertas pasarían igual, pero verificarían un artefacto que se dice de otra
      # versión. El historial completo cuesta 8,5 MiB (`git count-objects -vH`, 2026-09-12), y
      # por eso no se recorta con filtros parciales: no hay nada que ahorrar.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Anclar el kit de desarrollo
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # El visor lo empaqueta `GeometriaFactory.Web.csproj` al construir la solución (target
      # `BuildVisor`), y por eso Node hace falta también acá.
      - name: Anclar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # DC-5 · TODO PROYECTO Y TODA CARPETA DE SAMPLE TIENEN NODO EN LA SOLUCIÓN. Va antes de construir
      # porque una solución a la que le falta un nodo construye igual: la reestructuración del
      # 2026-09-12 dejó once carpetas de `samples/` afuera y ninguna puerta lo notó. No necesita .NET.
      - name: Árbol de solución · todo proyecto y todo sample tienen nodo en GeometriaFactory.sln
        run: bash scripts/verify-solution-tree.sh

      - name: Puerta QG-01 · construir sin advertencias, con el bundle del visor
        run: ./scripts/build.sh

      - name: Puerta QG-02 · la batería entera
        run: ./scripts/test.sh

      # LA COBERTURA Y LAS PUERTAS DE FASE CORREN ACÁ desde la mesa del 2026-09-14 (R-12): hasta
      # entonces existían y nadie las corría, y una puerta que no corre no frena. `coverage.sh`
      # mide QG-03 por proyecto, QG-06 sobre el validador de figuras y QG-04 la pirámide.
      - name: Puertas QG-03, QG-06 y QG-04 · cobertura
        run: ./scripts/coverage.sh

      # Sólo las puertas que necesitan `dotnet` y nada más. `c` levanta las dos piezas, `f` y `g`
      # corren un navegador en contenedor, e `i` mira el despliegue: siguen siendo manuales.
      - name: Puerta de la etapa d
        run: bash scripts/verify-stage-d.sh
      - name: Puerta de la etapa e
        run: bash scripts/verify-stage-e.sh
      - name: Puerta de la etapa h
        run: bash scripts/verify-stage-h.sh
