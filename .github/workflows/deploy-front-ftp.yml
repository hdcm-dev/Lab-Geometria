# Publicación del front por transferencia al hosting (intake §17.6.P.7 y §17.6.P.8;
# `Pipeline-Producto.md` §4).
#
# EL FILTRO DE RUTAS LLEVA TRES ENTRADAS, y la tercera entró por una corrección declarada:
# sin `GeometriaFactory.Contracts`, un cambio del contrato no dispara la publicación y las dos
# unidades quedan desalineadas SIN QUE NADA FALLE.
#
# Y NO TERMINA EN LA SUBIDA: termina comprobando que la dirección pública responde.
#
# NO EMPIEZA POR PUBLICAR, TAMPOCO. Antes de subir corre las dos puertas que
# `Api/09 Pipeline-CI-CD.md` §2.1 declara **bloqueantes**: `QG-01` —la construcción termina en 0
# y **sin advertencias**— y `QG-02` —la batería pasa entera, incluida la del validador—. Hasta el
# 2026-08-18 este flujo no corría ninguna de las dos: `dotnet publish` compila, así que un error
# de compilación frenaba la publicación, pero **una advertencia y la batería entera en rojo
# pasaban igual**. La comprobación final tampoco lo veía: la página carga y responde 200 con el
# producto roto por dentro.
#
# LOS DOS PASOS INVOCAN LOS GUIONES DEL REPOSITORIO y no reescriben sus órdenes: `scripts/build.sh`
# y `scripts/test.sh` son los mismos que corren en la máquina de quien construye, y son los que esa
# tabla de stages nombra. Un `dotnet test` escrito acá a mano sería un segundo lugar donde la
# configuración puede decir otra cosa, que es el defecto que `verify-explicit-configuration.sh`
# existe para impedir.
#
# Ninguna dirección real vive acá: todas llegan como secretos del repositorio.

name: deploy-front-ftp

on:
  push:
    branches: [main]
    paths:
      - 'src/GeometriaFactory.Web/**'
      - 'visor/**'
      - 'src/GeometriaFactory.Contracts/**'
      # LA CUARTA ENTRADA, y entró por un defecto pagado el 2026-09-01: el cambio que agregó
      # los reintentos de FTP se fusionó a `main` y NO DISPARÓ ESTA PUBLICACIÓN, porque el
      # archivo del flujo no estaba en su propio filtro. Hubo que lanzarla a mano para saber
      # si el arreglo servía. UN PUBLICADOR QUE NO SE EJERCITA CUANDO SE LO MODIFICA se
      # descubre roto el día que se lo necesita, que es exactamente lo que pasó.
      - '.github/workflows/deploy-front-ftp.yml'
  workflow_dispatch:

jobs:
  publish-front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Anclar el kit de desarrollo
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Anclar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `build.sh` EMPAQUETA EL VISOR ADENTRO, y por eso el paso suelto que estaba acá se
      # retiró: su línea 21 invoca `build-visor.sh` antes de compilar la solución. Dejarlos a
      # los dos habría corrido `npm ci` y webpack dos veces por publicación, y habría dejado
      # dos lugares desde donde se genera el mismo artefacto.
      - name: Puerta QG-01 · construir sin advertencias, con el bundle del visor
        run: ./scripts/build.sh

      - name: Puerta QG-02 · la batería entera
        run: ./scripts/test.sh

      - name: Publicar el front
        run: dotnet publish src/GeometriaFactory.Web/GeometriaFactory.Web.csproj -c Release -o ./publish

      - name: Inyectar la direccion del servicio de datos desde secretos
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$API_BASE_URL"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('publish/appsettings.json')
          settings = json.loads(path.read_text(encoding='utf-8'))
          settings['ApiBaseUrl'] = os.environ['API_BASE_URL']
          path.write_text(json.dumps(settings, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      # ---- BAJAR LA APLICACION ANTES DE SUBIR, Y LEVANTARLA SIEMPRE -------------------
      #
      # EL `550` NO ERA TRANSITORIO, Y POR ESO REINTENTAR NO SERVIA. Medido el 2026-09-01
      # sobre el anfitrion real, en la corrida #37:
      #
      #     Subir por FTP · intento 1   ->  550, en GeometriaFactory.Web.pdb
      #     Subir por FTP · intento 2   ->  550, el mismo archivo   (tras esperar  90 s)
      #     Subir por FTP · intento 3   ->  550, el mismo archivo   (tras esperar 180 s)
      #
      # IIS tiene los ensamblados abiertos MIENTRAS LA APLICACION CORRE, y no los suelta por
      # esperar. La unica corrida que subio bien —la #34, de las 11:19— subio porque el sitio
      # estaba DORMIDO: somee duerme las aplicaciones ociosas, y una aplicacion dormida suelta
      # sus archivos. Desde que se empezo a mirar el sitio para probarlo, deja de dormirse, y
      # la publicacion dejo de funcionar. «Antes andaba» tiene exactamente esa explicacion, y
      # la version anterior de este bloque —tres intentos con esperas— fue una hipotesis
      # equivocada: trataba como transitorio algo permanente. Se retira entera.
      #
      # `app_offline.htm` ES EL MECANISMO DE IIS PARA ESTO, no un truco. Al aparecer ese
      # archivo en la raiz, el anfitrion detiene la aplicacion —libera los ensamblados— y
      # sirve su contenido; al borrarlo, la levanta. VERIFICADO A MANO CONTRA EL ANFITRION
      # REAL antes de escribirlo aca: con el archivo puesto el sitio devuelve 503, y al
      # sacarlo `/estado` volvio en 200 mostrando la version y el reloj DEL SERVICIO DE DATOS.
      #
      # Y RESUELVE UN SEGUNDO DEFECTO QUE ESTABA TAPADO POR EL PRIMERO. `Program.cs` linea 70
      # lee `ApiBaseUrl` UNA SOLA VEZ, al construir el `HttpClient`. Subir un `appsettings.json`
      # nuevo NO CAMBIA NADA mientras el proceso siga vivo. El 2026-09-01 la direccion correcta
      # estuvo en disco durante horas —habia subido bien, porque va antes del archivo que
      # traba— con la aplicacion todavia llamando al tunel muerto, y el sitio mostrando «no
      # pudimos crear la cuenta». UNA PUBLICACION QUE NO REINICIA NO ES UNA PUBLICACION.
      #
      # EL PASO QUE LA LEVANTA LLEVA `if: always()`, Y ES LO MAS IMPORTANTE DE ESTE BLOQUE:
      # si la subida falla y nadie borra el archivo, EL SITIO QUEDA CAIDO. El paso corre
      # aunque la subida haya fallado, y si el borrado mismo falla, la corrida falla y se ve.
      #
      # NI LA BARRA FINAL NI EL ESQUEMA SE SUPONEN, y no es celo vacio: el registro del
      # proveedor anota la direccion como `ftp://aplicada.somee.com`, mientras que el parametro
      # `server:` de la accion quiere un nombre pelado. El mismo secreto sirve a los dos usos,
      # asi que el guion le saca el `ftp://` y la barra sobrante. Una ruta mal armada aca no
      # da un error claro: DEJA EL SITIO ABAJO, porque el borrado del `app_offline.htm` apunta
      # a un lugar que no existe.

      - name: Bajar la aplicacion del anfitrion
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          set -euo pipefail
          host="${FTP_SERVER#ftp://}"; host="${host%/}"
          dir="/${FTP_DIR#/}"; dir="${dir%/}"
          cat > app_offline.htm <<'HTM'
          <!doctype html><meta charset="utf-8"><title>Fabrica de Geometria · actualizando</title>
          <body style="font-family:system-ui;max-width:34rem;margin:6rem auto;padding:0 1rem">
          <h1 style="font-size:1.25rem">Estamos actualizando el laboratorio</h1>
          <p>Vuelve en un minuto. Nada de lo guardado se pierde.</p>
          HTM
          curl --silent --show-error --fail --max-time 120 \
            --upload-file app_offline.htm \
            "ftp://${host}${dir}/app_offline.htm" \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}"
          echo "app_offline.htm en su lugar. Ahora hay que ESPERAR A QUE BAJE DE VERDAD."

          # SUBIR EL ARCHIVO NO ES QUE LA APLICACION ESTE ABAJO, y confundir las dos cosas
          # costo la corrida #39: el paso subia el archivo y arrancaba a copiar en el acto,
          # IIS todavia no habia terminado de drenar, y la copia murio con 550 en
          # `GeometriaFactory.Contracts.dll`. Medido a mano contra el anfitrion real:
          #
          #     aplicacion arriba   ->  curl: (25) Failed FTP upload: 550
          #     sitio en HTTP 503   ->  subio
          #
          # Asi que no se supone: se espera hasta VER el 503, y si no llega, se falla acá
          # —con la aplicacion abajo— en vez de fallar a mitad de la copia con el sitio en
          # un estado mezclado. Es el mismo defecto que la mesa del 2026-09-01 nombro para
          # todo el producto: VERIFICAR LA CONDICION Y NO EL EFECTO.
          for intento in $(seq 1 30); do
            codigo="$(curl --silent --output /dev/null --write-out '%{http_code}' \
                      --max-time 15 "$PUBLIC_URL" || true)"
            if [ "$codigo" = "503" ]; then
              echo "La aplicacion esta abajo (HTTP 503) tras $((intento * 5)) s. Los ensamblados quedaron libres."
              exit 0
            fi
            sleep 5
          done
          echo "::error::app_offline.htm esta puesto pero el sitio sigue respondiendo $codigo despues de 150 s."
          echo "No se copia nada: una copia sobre la aplicacion viva falla a la mitad y deja el sitio mezclado."
          exit 1

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/app_offline.htm

      - name: Levantar la aplicacion
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          set -euo pipefail
          host="${FTP_SERVER#ftp://}"; host="${host%/}"
          dir="/${FTP_DIR#/}"; dir="${dir%/}"
          curl --silent --show-error --fail --max-time 120 \
            "ftp://${host}${dir}/" \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --quote "-DELE ${dir}/app_offline.htm" --output /dev/null
          echo "app_offline.htm retirado. Se espera a que la aplicacion vuelva a atender."

          # Y ACA TAMBIEN SE MIRA EL EFECTO. Un arranque en frio de Blazor sobre este
          # anfitrion tarda; darle un `sleep` fijo y seguir haria que la comprobacion final
          # falle por impaciencia y no por un defecto real.
          for intento in $(seq 1 24); do
            codigo="$(curl --silent --output /dev/null --write-out '%{http_code}' \
                      --max-time 20 "$PUBLIC_URL" || true)"
            case "$codigo" in
              503|000) sleep 5 ;;
              *) echo "La aplicacion volvio (HTTP $codigo) tras $((intento * 5)) s, leyendo el appsettings.json recien subido."; exit 0 ;;
            esac
          done
          echo "::error::La aplicacion no volvio a atender despues de 120 s: sigue en $codigo."
          exit 1

      - name: Comprobar que la direccion publica responde
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          set -euo pipefail
          # LA COMPROBACION EXIGE SU SECRETO, igual que la inyeccion de la direccion del
          # servicio de datos. Sin esta linea, un secreto vacio no falla acá: falla adentro de
          # curl con «Malformed input to a URL function», que no nombra el secreto que falta y
          # manda a buscar el problema al lugar equivocado. Ya pasó una vez.
          test -n "$PUBLIC_URL" || { echo "Falta el secreto PUBLIC_URL del repositorio."; exit 1; }
          status_code="$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL")"
          echo "La direccion publica respondio $status_code"
          test "$status_code" = "200" || { echo "La direccion publica no respondio 200."; exit 1; }

          # ---- Y AHORA SE MIRA EL CONTENIDO, PORQUE EL 200 NO ALCANZA -------------------
          #
          # Hasta el 2026-09-01 esta comprobacion terminaba en la linea de arriba, y por eso
          # el flujo podia declarar `success` con el sitio PUBLICADO Y SIN DATOS: la pagina
          # de estado devuelve 200 aunque adentro diga que el servicio de datos no responde.
          # La mesa del 2026-09-01 lo levanto, y el Product Owner lo vio antes que nadie:
          # «hasta ahora no vi resultados funcionando».
          #
          # PUBLICADO Y ROTO NO ES UN EXITO. La pagina de estado existe para decir si el dato
          # es real; si dice que no, la publicacion no cumplio su proposito.
          estado="$(curl --silent --show-error --location --max-time 40 "${PUBLIC_URL%/}/estado" || true)"
          if printf '%s' "$estado" | grep -q 'class="failure"'; then
            echo "::error::El sitio esta publicado y NO alcanza al servicio de datos."
            printf '%s' "$estado" | grep -oE '<p class="failure"[^>]*>[^<]{0,160}' | head -1
            echo "Revisar el secreto API_BASE_URL y que esa direccion sea alcanzable DESDE somee."
            exit 1
          fi
          echo "El sitio publicado alcanza al servicio de datos."
          test "$status_code" = "200"
