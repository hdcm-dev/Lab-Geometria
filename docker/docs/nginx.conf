# nginx del portal de documentación de Lab-Geometria (expediente 0003, folio 018 §3 y §8, PR-P7).
# Reemplaza /etc/nginx/conf.d/default.conf de nginx-unprivileged. Sitio estático, sólo lectura, puerto 8080.
#   - URLs de directorio: /<ruta>/ sirve /<ruta>/index.html; el Markdown crudo es /<ruta>.md (o /<ruta>/index.md).
#   - Lo que no existe da 404: sin autoindex y sin servir un índice por defecto en su lugar.
#   - .md como text/markdown; todo en utf-8.
#   - Cabeceras de seguridad a nivel de server: ningún location define add_header (si lo hiciera, dejaría de heredarlas).
server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;
    autoindex     off;
    charset       utf-8;
    charset_types text/html text/plain text/css text/markdown application/javascript application/json
                  application/linkset+json text/xml application/xml;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    include /etc/nginx/conf.d/revision.inc;

    # Archivos ocultos (p. ej. /.git/HEAD) nunca, salvo /.well-known/.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        try_files $uri =404;
    }

    # Markdown crudo. `types {}` vacío en el location (y no en el server) para no pisar los tipos de mime.types.
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        try_files $uri =404;
    }

    # Directorio con barra: sólo su index.html. Sin él, 404 (y no 403 ni un listado).
    location ~ /$ {
        try_files ${uri}index.html =404;
    }

    # El try_files del folio 018 §3 ($uri $uri.html $uri/index.html =404), con una salvedad: /<ruta> sin barra cuyo
    # index.html existe redirige a /<ruta>/ en vez de servirlo ahí, porque las páginas usan rutas relativas a su URL.
    location / {
        try_files $uri $uri.html @directorio;
    }
    location @directorio {
        if (-f $request_filename/index.html) {
            return 301 $uri/;
        }
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
